name: Build Under Box
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target UnderBox_VST3 -j 4

      - name: Package
        run: Compress-Archive -Path "build/UnderBox_artefacts/Release/VST3/Under Box.vst3" -DestinationPath UnderBox-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: UnderBox-Windows
          path: UnderBox-Windows-VST3.zip
